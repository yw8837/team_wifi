name: 모두육아 checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - name: Public release and preserved beta PostgreSQL checks
        run: |
          mkdir -p artifacts/beta .runtime/tmp/ci-pg
          python backend/tests/verify_public_postgres.py --pg-bin "$(pg_config --bindir)" --runtime "$PWD/.runtime/tmp/ci-pg"
      - uses: actions/upload-artifact@v4
        with:
          name: public-postgres-evidence
          path: artifacts/beta/public-release-postgres-results.json
          if-no-files-found: error
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Public release build with HTTPS mode guard
        run: npm run build
        working-directory: frontend
        env:
          VITE_PUBLIC_RELEASE: '1'
          VITE_BETA_MODE: '0'
          VITE_API_BASE_URL: https://moduyuga-beta.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: public-web-candidate
          path: frontend/dist
          if-no-files-found: error
      - run: npm audit --audit-level=moderate
        working-directory: frontend
  unsigned-android:
    if: github.event_name == 'push'
    needs: [api, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PUBLIC_RELEASE: '1'
      VITE_BETA_MODE: '0'
      VITE_API_BASE_URL: https://moduyuga-beta.onrender.com/api
      MODU_LOCAL_ANDROID: '0'
      MODU_VERSION_CODE: '4'
      MODU_VERSION_NAME: '0.3.0'
      MODU_UNSIGNED_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm run build && npx cap sync android
        working-directory: frontend
      - run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon --max-workers=2
        working-directory: frontend/android
      - run: python scripts/prepare-unsigned-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-4
          path: artifacts/android/unsigned-ci
          if-no-files-found: error
